    from{ opacity:0; transform:scale(0.96); }
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes overlayFadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes press3d{
    0%{ transform:perspective(500px) rotateX(0) translateY(0) scale(1); }
    40%{ transform:perspective(500px) rotateX(12deg) translateY(2px) scale(0.94); }
    100%{ transform:perspective(500px) rotateX(0) translateY(0) scale(1); }
  }
  .press3d{
    animation:press3d 0.32s ease;
    transform-origin:center bottom;
  }
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.6;
    transition:background 0.2s ease, color 0.2s ease;
  }
  #particles{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .wrap{
    max-width:clamp(680px, 55vw, 860px);
    margin:0 auto;
    padding:clamp(28px, 8vw, 64px) clamp(16px, 5vw, 32px) clamp(48px, 10vw, 90px);
    position:relative;
    z-index:1;
    perspective:1200px;
  }
  header{
    border-bottom:1px solid var(--line);
    padding-bottom:clamp(20px, 5vw, 28px);
    margin-bottom:clamp(20px, 5vw, 28px);
    padding-right:44px;
    position:relative;
    animation:fadeInUp 0.5s ease both;
  }
  .theme-toggle{
    position:absolute;
    top:0;
    right:0;
    width:clamp(28px, 7vw, 34px);
    height:clamp(28px, 7vw, 34px);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(13px, 3vw, 15px);
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line);
    border-radius:50%;
    cursor:pointer;
    line-height:1;
    transition:transform 0.35s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .theme-toggle:hover{
    border-color:var(--accent);
    color:var(--accent);
    transform:rotate(20deg);
  }
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:clamp(26px, 4.2vw, 42px);
    margin-bottom:30px;
    overflow-wrap:break-word;
  }
  .tagline{
    font-size:clamp(14px, 1.6vw, 17px);
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .nav-btn{
    font-family:'Inter',sans-serif;
    font-size:clamp(12px, 3vw, 13px);
    font-weight:500;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line);
    padding:8px clamp(12px, 3vw, 16px);
    cursor:pointer;
    border-radius:10px;
    transition:all 0.15s ease;
  }
  .nav-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
    transform:translateY(-1px);
  }
  .nav-btn:active{
    transform:translateY(0) scale(0.96);
  }
  .nav-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  section{ display:none; }
  section.active{
    display:block;
    animation:fadeInUp 0.35s ease both;
  }
  section.active .achieve-group,
  section.active .post,
  section.active .contact-row{
    animation:fadeInUp 0.4s ease both;
  }
  section.active .achieve-group:nth-child(1),
  section.active .post:nth-child(1),
  section.active .contact-row:nth-child(1){ animation-delay:0.05s; }
  section.active .achieve-group:nth-child(2),
  section.active .post:nth-child(2),
  section.active .contact-row:nth-child(2){ animation-delay:0.1s; }
  section.active .achieve-group:nth-child(3),
  section.active .post:nth-child(3),
  section.active .contact-row:nth-child(3){ animation-delay:0.15s; }
  section.active .achieve-group:nth-child(4),
  section.active .post:nth-child(4),
  section.active .contact-row:nth-child(4){ animation-delay:0.2s; }

  .bio{
    font-size:clamp(15px, 1.6vw, 17px);
    color:var(--ink-soft);
    max-width:60ch;
    white-space:pre-line;
  }

  .section-title{
    font-family:'Source Serif 4',serif;
    font-size:20px;
    font-weight:600;
    margin-bottom:18px;
  }

  .achieve-group{
    border:1px solid var(--line);
    border-radius:6px;
    padding:clamp(14px, 4vw, 18px) clamp(14px, 4vw, 20px);
    margin-bottom:16px;
    transition:border-color 0.2s ease, transform 0.1s ease;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .achieve-group:hover{
    border-color:var(--accent);
  }
  .achieve-group:last-child{ margin-bottom:0; }
  .achieve-head{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:flex-start;
    gap:6px 12px;
    margin-bottom:6px;
  }
  .achieve-title{
    font-family:'Source Serif 4',serif;
    font-size:18px;
    font-weight:600;
  }
  .achieve-date{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .achieve-summary{
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:14px;
  }
  .achieve-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:4px 12px;
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .achieve-label{
    font-size:13px;
    color:var(--ink-soft);
  }
  .achieve-value{
    font-size:14px;
    font-weight:500;
  }
  .cert-btn{
    margin-top:14px;
    font-size:12px;
    font-weight:500;
    color:var(--accent);
    background:transparent;
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .cert-btn:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
  }
  .cert-btn:active{
    transform:translateY(0) scale(0.96);
  }
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(21,26,38,0.72);
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:100;
  }
  .modal-overlay.open{
    display:flex;
    animation:overlayFadeIn 0.2s ease both;
  }
  .modal-box{
    background:var(--bg);
    max-width:520px;
    width:100%;
    max-height:90vh;
    overflow:auto;
    border-radius:10px;
    padding:16px;
    animation:fadeScaleIn 0.25s ease both;
  }
  .modal-box img{
    width:100%;
    display:block;
    border-radius:10px;
  }
  .modal-close{
    display:block;
    margin:12px auto 0;
    font-size:13px;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--line);
    padding:8px 18px;
    border-radius:10px;
    cursor:pointer;
  }

  .post{
    padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  .post:last-child{ border-bottom:none; }
  .post-title{
    font-family:'Source Serif 4',serif;
    font-size:17px;
    font-weight:600;
    margin-bottom:4px;
  }
  .post-date{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .post-body{
    font-size:14px;
    color:var(--ink-soft);
  }
  .post-attribution{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:8px;
    font-style:italic;
  }

  .contact-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:4px 12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
    transition:padding-left 0.2s ease;
  }
  .contact-row:hover{ padding-left:6px; }
  .contact-row:last-child{ border-bottom:none; }
  .contact-label{
    font-size:13px;
    color:var(--ink-soft);
  }
  .contact-value{
    font-size:14px;
    font-weight:500;
  }
  .links{
    margin-top:24px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .link-btn{
    font-size:13px;
    font-weight:500;
    color:var(--accent);
    text-decoration:none;
    border:1px solid var(--line);
    padding:9px 16px;
    border-radius:10px;
    transition:all 0.2s ease;
    display:inline-block;
  }
  .link-btn:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
  }
  .link-btn:active{
    transform:translateY(0) scale(0.96);
  }

  footer{
    margin-top:48px;
    font-size:12px;
    color:var(--ink-soft);
  }
  @media (max-width:380px){
    .nav-btn{ flex:1 1 auto; text-align:center; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    .achieve-group{ transform:none !important; }
    #particles{ display:none; }
  }
</style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="wrap">
    <header>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">&#9789;</button>
      <h1 id="name"></h1>
      <div class="tagline" id="tagline"></div>
      <nav id="nav"></nav>
    </header>

    <section id="sec-about" class="active">
      <h2 class="section-title">About</h2>
      <div class="bio" id="bio"></div>
    </section>

    <section id="sec-achievements">
      <h2 class="section-title">Achievements</h2>
      <div id="achievements"></div>
    </section>

    <section id="sec-posts">
      <h2 class="section-title">Posts</h2>
      <div id="posts"></div>
    </section>

    <section id="sec-contact">
      <h2 class="section-title">Contact</h2>
      <div id="contacts"></div>
      <div class="links" id="links"></div>
    </section>

    <footer></footer>
  </div>

  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Certificate viewer">
    <div class="modal-box">
      <img id="modal-img" src="" alt="Certificate">
      <button class="modal-close" id="modal-close">Close</button>
    </div>
  </div>

<script>
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

document.getElementById('name').textContent = DATA.name;
document.getElementById('tagline').textContent = DATA.tagline;
if (!DATA.tagline) document.getElementById('tagline').style.display = 'none';
document.getElementById('bio').textContent = DATA.bio;

const themeBtn = document.getElementById('theme-toggle');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.innerHTML = t === 'dark' ? '&#9728;' : '&#9789;';
  localStorage.setItem('theme', t);
}
applyTheme(localStorage.getItem('theme') || 'light');
themeBtn.onclick = () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
};

const tabs = [
  { id: 'about', label: 'About' },
  { id: 'achievements', label: 'Achievements' },
  { id: 'posts', label: 'Posts' },
  { id: 'contact', label: 'Contact' }
];
const navEl = document.getElementById('nav');
tabs.forEach((t, i) => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
  btn.textContent = t.label;
  btn.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-' + t.id).classList.add('active');
  };
  navEl.appendChild(btn);
});

const achEl = document.getElementById('achievements');
const modalOverlay = document.getElementById('modal-overlay');
const modalImg = document.getElementById('modal-img');
document.getElementById('modal-close').onclick = () => modalOverlay.classList.remove('open');
modalOverlay.onclick = (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('open'); };

DATA.achievementGroups.forEach(g => {
  const group = document.createElement('div');
  group.className = 'achieve-group';

  const head = document.createElement('div');
  head.className = 'achieve-head';
  head.innerHTML = `<div class="achieve-title">${g.title}</div><div class="achieve-date">${g.date}</div>`;
  group.appendChild(head);

  const summary = document.createElement('div');
  summary.className = 'achieve-summary';
  summary.textContent = g.summary;
  group.appendChild(summary);

  g.rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'achieve-row';
    row.innerHTML = `<div class="achieve-label">${r.label}</div><div class="achieve-value">${r.value}</div>`;
    group.appendChild(row);
  });

  if (g.certificate) {
    const btn = document.createElement('button');
    btn.className = 'cert-btn';
    btn.textContent = 'View certificate';
    btn.setAttribute('aria-label', 'View ' + g.title + ' certificate');
    btn.onclick = () => {
      modalImg.src = g.certificate;
      modalImg.alt = g.title + " certificate — " + g.summary;
      modalOverlay.classList.add('open');
    };
    group.appendChild(btn);
  }

  achEl.appendChild(group);
});

const postsEl = document.getElementById('posts');
DATA.posts.forEach(p => {
  const div = document.createElement('div');
  div.className = 'post';
  const titleHtml = p.title ? `<div class="post-title">${p.title}</div>` : '';
  const attrHtml = p.attribution ? `<div class="post-attribution">${p.attribution}</div>` : '';
  div.innerHTML = `${titleHtml}<div class="post-date">${p.date}</div><div class="post-body">${p.body}</div>${attrHtml}`;
  postsEl.appendChild(div);
});

const contactsEl = document.getElementById('contacts');
DATA.contacts.forEach(c => {
  const a = document.createElement('a');
  a.className = 'contact-row';
  a.href = c.href;
  a.innerHTML = `<div class="contact-label">${c.label}</div><div class="contact-value">${c.value}</div>`;
  contactsEl.appendChild(a);
});

const linksEl = document.getElementById('links');
DATA.links.forEach(l => {
  const a = document.createElement('a');
  a.className = 'link-btn';
  a.href = l.href;
  a.target = '_blank';
  a.textContent = l.label;
  linksEl.appendChild(a);
});

/* --- 3D press effect on every clickable button --- */
document.querySelectorAll('.nav-btn, .link-btn, .cert-btn, .theme-toggle, .modal-close').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.remove('press3d');
    void btn.offsetWidth;
    btn.classList.add('press3d');
  });
});

/* --- let hover-tilt take over transform once entrance animation finishes --- */
document.querySelectorAll('.achieve-group, .post, .contact-row').forEach(el => {
  el.addEventListener('animationend', () => { el.style.animationName = 'none'; });
});

/* --- 3D tilt on achievement cards --- */
if (!prefersReducedMotion) {
  document.querySelectorAll('.achieve-group').forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const rx = ((y / r.height) - 0.5) * -8;
      const ry = ((x / r.width) - 0.5) * 8;
      card.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(700px) rotateX(0) rotateY(0)';
    });
  });
}

/* --- soft floating particle background --- */
if (!prefersReducedMotion) {
function startParticles(){
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
function resizeCanvas(){ pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const isSmall = window.innerWidth < 700;
const particleCount = isSmall ? 18 : 36;
const particles = Array.from({length:particleCount}, () => ({
  x: Math.random()*pCanvas.width,
  y: Math.random()*pCanvas.height,
  z: Math.random()*1 + 0.3,
  speed: Math.random()*0.15 + 0.05
}));
function hexToRgba(hex, alpha){
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const num = parseInt(hex, 16);
  const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}
/* cache the accent color instead of calling getComputedStyle every frame;
   refresh only when the theme actually changes */
let cachedColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#1E2A4A';
const themeObserver = new MutationObserver(() => {
  cachedColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#1E2A4A';
});
themeObserver.observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
function tickParticles(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  particles.forEach(p => {
    p.y -= p.speed * p.z;
    if (p.y < -5) { p.y = pCanvas.height + 5; p.x = Math.random()*pCanvas.width; }
    const r = p.z * 1.6;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, r, 0, Math.PI*2);
    pCtx.fillStyle = hexToRgba(cachedColor, 0.10 + p.z*0.12);
    pCtx.fill();
  });
  requestAnimationFrame(tickParticles);
}
tickParticles();
}
/* delay start so particles don't compete with initial content render */
if ('requestIdleCallback' in window) {
  requestIdleCallback(startParticles, { timeout: 1500 });
} else {
  setTimeout(startParticles, 200);
}
}
</script>
</body>
</html>
